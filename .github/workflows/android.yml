
name: Traffic City 3D Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command line tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          cd /tmp
          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

          sudo mv Godot_v4.3-stable_linux.x86_64 \
            /usr/local/bin/godot

          godot --version

      - name: Install Android export templates
        shell: bash
        run: |
          set -euo pipefail

          DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$DIR"

          wget -q \
            https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* "$DIR/"

          test -s "$DIR/android_debug.apk"
          test -s "$DIR/android_release.apk"

      - name: Generate Android debug keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Traffic City,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Create Android export preset
        shell: bash
        run: |
          set -euo pipefail

          cat > export_presets.cfg <<EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/TrafficCity3D.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          gradle_build/use_gradle_build=false
          package/unique_name="com.trafficcity3d.game"
          package/name="Traffic City 3D"
          package/signed=true
          version/code=1
          version/name="0.1"
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug="$HOME/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          godot --headless \
            --path . \
            --editor \
            --import \
            --quit

      - name: Diagnose export configuration
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          python3 - <<'PY'
          import configparser
          import os
          import pathlib
          import subprocess

          output = []

          def report(label, value):
              line = f"{label}: {value}"
              print(line)
              output.append(line)

          root = pathlib.Path.cwd()
          home = pathlib.Path.home()
          sdk = pathlib.Path(os.environ["ANDROID_HOME"])
          java = pathlib.Path(os.environ["JAVA_HOME"])

          report("Godot project", (root / "project.godot").is_file())
          report("Main scene", (root / "main.tscn").is_file())
          report("City script", (root / "city.gd").is_file())
          report("Android SDK", sdk.is_dir())
          report("Java SDK", java.is_dir())

          for version in ("34.0.0", "35.0.0"):
              report(
                  "Build Tools " + version,
                  (sdk / "build-tools" / version).is_dir()
              )

          template = (
              home / ".local/share/godot/export_templates"
              / "4.3.stable/android_debug.apk"
          )
          report("Android export template", template.is_file())

          key = home / ".android/debug.keystore"
          report("Debug keystore", key.is_file())

          preset = configparser.ConfigParser(
              interpolation=None,
              delimiters=("=",),
              strict=False
          )
          preset.optionxform = str
          preset.read("export_presets.cfg")

          report("Preset sections", preset.sections())

          if preset.has_section("preset.0"):
              report(
                  "Platform",
                  preset.get("preset.0", "platform", fallback="MISSING")
              )

          if preset.has_section("preset.0.options"):
              options = preset["preset.0.options"]
              for name in (
                  "package/unique_name",
                  "package/name",
                  "package/signed",
                  "gradle_build/use_gradle_build",
                  "keystore/debug",
                  "architectures/arm64-v8a"
              ):
                  report(name, options.get(name, "MISSING"))

          result = subprocess.run(
              [
                  "keytool", "-list",
                  "-keystore", str(key),
                  "-storepass", "android",
                  "-alias", "androiddebugkey"
              ],
              capture_output=True,
              text=True
          )

          report("Keystore valid", result.returncode == 0)

          pathlib.Path(
              "diagnostics/configuration.txt"
          ).write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Build Android APK
        shell: bash
        run: |
          mkdir -p build diagnostics

          set +e

          godot --headless \
            --verbose \
            --path . \
            --export-debug "Android" \
            build/TrafficCity3D.apk \
            > diagnostics/export.log 2>&1

          RESULT=$?

          cat diagnostics/export.log

          echo "=== EXPORT RESULT ==="
          echo "$RESULT"

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Godot export configuration rejected"
            exit 1
          fi

          if [ ! -s build/TrafficCity3D.apk ]; then
            echo "::error::APK missing"
            exit 1
          fi

          echo "APK successfully created"

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrafficCity3D-Diagnostics
          path: diagnostics/
          if-no-files-found: ignore

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrafficCity3D-Android
          path: build/TrafficCity3D.apk
          if-no-files-found: error

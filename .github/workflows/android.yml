name: Build Traffic City 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q \
            commandlinetools-linux-11076708_latest.zip

          mv cmdline-tools \
            "$SDK_ROOT/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -e

          wget -q \
            https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          unzip -q \
            Godot_v4.3-stable_linux.x86_64.zip

          chmod +x \
            Godot_v4.3-stable_linux.x86_64

          sudo mv \
            Godot_v4.3-stable_linux.x86_64 \
            /usr/local/bin/godot

          godot --version

      - name: Install export templates
        shell: bash
        run: |
          set -e

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"

          mkdir -p "$TEMPLATE_DIR"

          wget -q \
            https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          unzip -q \
            Godot_v4.3-stable_export_templates.tpz

          mv templates/* "$TEMPLATE_DIR/"

          ls -lah "$TEMPLATE_DIR"

      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Traffic City 3D,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import Godot project
        shell: bash
        run: |
          set -e

          godot --headless \
            --path . \
            --editor \
            --import \
            --quit

      - name: Configure Godot editor
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Create Android export preset
        shell: bash
        run: |
          set -e

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/TrafficCity3D.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          gradle_build/use_gradle_build=false
          package/unique_name="com.trafficcity3d.game"
          package/name="Traffic City 3D"
          version/code=1
          version/name="0.1"
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""
          EOF

      - name: Diagnose Android environment
        shell: bash
        run: |
          set -e

          echo "=== PROJECT FILES ==="
          ls -lah
          test -f project.godot
          test -f main.tscn
          test -f city.gd

          echo "=== ANDROID SDK ==="
          echo "$ANDROID_HOME"
          ls -lah "$ANDROID_HOME"

          echo "=== BUILD TOOLS ==="
          ls -lah "$ANDROID_HOME/build-tools"

          echo "=== JAVA ==="
          java -version
          echo "$JAVA_HOME"

          echo "=== DEBUG KEYSTORE ==="
          test -s "$HOME/.android/debug.keystore"
          echo "Debug keystore exists"

          echo "=== GODOT EXPORT TEMPLATES ==="
          ls -lah \
            "$HOME/.local/share/godot/export_templates/4.3.stable"

          echo "=== EDITOR CONFIG ==="
          grep -E \
            'android_sdk_path|java_sdk_path|debug_keystore =' \
            "$HOME/.config/godot/editor_settings-4.tres"

          echo "=== EXPORT PRESET ==="
          cat export_presets.cfg

      - name: Build Android APK
        id: apk
        shell: bash
        run: |
          mkdir -p build diagnostics

          set +e

          godot --headless \
            --verbose \
            --path . \
            --export-debug "Android" \
            build/TrafficCity3D.apk \
            > diagnostics/godot-export.log 2>&1

          RESULT=$?

          cat diagnostics/godot-export.log

          echo "=== EXPORT RESULT ==="
          echo "Godot exit code: $RESULT"

          echo "=== ERROR SUMMARY ==="
          grep -inE \
            'error|warning|invalid|missing|cannot|failed|keystore|sdk' \
            diagnostics/godot-export.log || true

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Godot Android export failed"
            exit 1
          fi

          if [ ! -s build/TrafficCity3D.apk ]; then
            echo "::error::APK file was not created"
            exit 1
          fi

          echo "=== APK CREATED ==="
          ls -lh build/TrafficCity3D.apk

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrafficCity3D-Diagnostics
          path: diagnostics/
          if-no-files-found: ignore

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrafficCity3D-Android
          path: build/TrafficCity3D.apk
          if-no-files-found: error

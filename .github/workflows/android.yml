name: Traffic City 3D - APK and Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail

          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip

          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

          godot --version

      - name: Install Godot Android templates
        shell: bash
        run: |
          set -euo pipefail

          DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$DIR"

          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz

          mv templates/* "$DIR/"

          test -s "$DIR/android_debug.apk"

      - name: Create signing key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Traffic City,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure editor settings
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Create export preset
        shell: bash
        run: |
          set -euo pipefail

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/TrafficCity3D.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          gradle_build/use_gradle_build=false
          package/unique_name="com.trafficcity3d.game"
          package/name="Traffic City 3D"
          version/code=1
          version/name="0.1"
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""
          EOF

      - name: Import project
        shell: bash
        run: |
          mkdir -p diagnostics

          godot --headless \
            --path . \
            --editor \
            --import \
            --quit \
            > diagnostics/import.log 2>&1

          cat diagnostics/import.log

      - name: Inspect actual Godot editor settings
        shell: bash
        run: |
          mkdir -p diagnostics

          cat > check_android.gd <<'EOF'
          extends SceneTree

          func _initialize():
              var settings = EditorInterface.get_editor_settings()

              var names = [
                  "export/android/android_sdk_path",
                  "export/android/java_sdk_path",
                  "export/android/debug_keystore",
                  "export/android/debug_keystore_user"
              ]

              for name in names:
                  print("SETTING: ", name)
                  print("EXISTS: ", settings.has_setting(name))

                  if settings.has_setting(name):
                      print("VALUE: ", settings.get_setting(name))

              quit()
          EOF

          set +e

          godot --headless \
            --editor \
            --path . \
            --script check_android.gd \
            > diagnostics/godot-settings.log 2>&1

          RESULT=$?

          cat diagnostics/godot-settings.log
          echo "Diagnostic script exit code: $RESULT"

          exit 0

      - name: Inspect SDK and export preset
        shell: bash
        run: |
          mkdir -p diagnostics

          {
            echo "=== GODOT ==="
            godot --version

            echo "=== JAVA ==="
            java -version 2>&1

            echo "=== ANDROID SDK ==="
            echo "$ANDROID_HOME"
            ls -la "$ANDROID_HOME"

            echo "=== BUILD TOOLS ==="
            ls -la "$ANDROID_HOME/build-tools"

            echo "=== ANDROID PLATFORMS ==="
            ls -la "$ANDROID_HOME/platforms"

            echo "=== EXPORT TEMPLATES ==="
            ls -lh "$HOME/.local/share/godot/export_templates/4.3.stable"

            echo "=== DEBUG KEYSTORE ==="
            keytool -list \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey

            echo "=== EXPORT PRESET ==="
            cat export_presets.cfg

            echo "=== PROJECT FILES ==="
            ls -la project.godot main.tscn city.gd

          } > diagnostics/environment.log 2>&1

          cat diagnostics/environment.log

      - name: Export Android APK
        shell: bash
        run: |
          mkdir -p build diagnostics

          set +e

          godot --headless \
            --verbose \
            --path . \
            --export-debug "Android" \
            build/TrafficCity3D.apk \
            > diagnostics/export.log 2>&1

          RESULT=$?

          cat diagnostics/export.log

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Android export failed - see diagnostics"
            exit 1
          fi

          test -s build/TrafficCity3D.apk

      - name: Verify Android APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="build/TrafficCity3D.apk"

          "$ANDROID_HOME/build-tools/34.0.0/aapt" \
            dump badging "$APK"

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify "$APK"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrafficCity3D-Diagnostics
          path: diagnostics/
          if-no-files-found: ignore

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrafficCity3D-Android-APK
          path: build/TrafficCity3D.apk
          if-no-files-found: error

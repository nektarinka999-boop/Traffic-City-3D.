
name: Traffic City 3D - Android APK 14

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare folders
        shell: bash
        run: |
          mkdir -p build diagnostics
          godot --version

      - name: Install Android command line tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          cd /tmp
          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O android-tools.zip

          unzip -q android-tools.zip -d android-tools

          mv android-tools/cmdline-tools \
            "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_HOME"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          yes | "$MANAGER" \
            --sdk_root="$SDK" --licenses || true

          "$MANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          test -f "$SDK/platforms/android-34/android.jar"
          test -f "$SDK/build-tools/34.0.0/aapt"

          echo "Android SDK 34 installed"

      - name: Locate Java 17
        shell: bash
        run: |
          set -euo pipefail

          JAVA_BIN="$(readlink -f "$(command -v java)")"
          JAVA_DIR="$(dirname "$(dirname "$JAVA_BIN")")"

          echo "JAVA_HOME=$JAVA_DIR" >> "$GITHUB_ENV"

          java -version

      - name: Install Godot Android templates
        shell: bash
        run: |
          set -euo pipefail

          TARGET="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TARGET"

          if [ ! -s "$TARGET/android_debug.apk" ]; then
            wget -q \
              https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
              -O /tmp/godot-templates.tpz

            mkdir -p /tmp/godot-templates
            unzip -q /tmp/godot-templates.tpz \
              -d /tmp/godot-templates

            cp -a /tmp/godot-templates/templates/. "$TARGET/"
          fi

          test -s "$TARGET/android_debug.apk"
          test -s "$TARGET/android_release.apk"

      - name: Create debug signing key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Traffic City 3D,O=Development,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot editor
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Create Android export preset
        shell: bash
        run: |
          set -euo pipefail

          cat > export_presets.cfg <<EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/TrafficCity3D.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          gradle_build/use_gradle_build=false
          package/unique_name="com.trafficcity3d.game"
          package/name="Traffic City 3D"
          version/code=1
          version/name="0.1"
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug="$HOME/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF

      - name: Import Godot project
        shell: bash
        run: |
          set +e

          godot --headless \
            --path . \
            --editor \
            --import \
            --quit \
            > diagnostics/import.log 2>&1

          RESULT=$?
          cat diagnostics/import.log
          exit "$RESULT"

      - name: Check Android environment
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=== GODOT ==="
            godot --version

            echo "=== JAVA ==="
            java -version 2>&1

            echo "=== ANDROID SDK ==="
            echo "$ANDROID_HOME"

            echo "=== ANDROID PLATFORM ==="
            ls -lh "$ANDROID_HOME/platforms/android-34/android.jar"

            echo "=== BUILD TOOLS ==="
            ls -lh "$ANDROID_HOME/build-tools/34.0.0/aapt"

            echo "=== EXPORT TEMPLATE ==="
            ls -lh \
              "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"

            echo "=== KEYSTORE ==="
            keytool -list \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey

            echo "=== EXPORT PRESET ==="
            cat export_presets.cfg

          } > diagnostics/environment.log 2>&1

          cat diagnostics/environment.log

      - name: Check Godot settings
        shell: bash
        run: |
          set +e

          godot --headless \
            --editor \
            --path . \
            --script res://check_export.gd \
            > diagnostics/check-export.log 2>&1

          RESULT=$?
          cat diagnostics/check-export.log
          echo "Diagnostic exit code: $RESULT"

          exit 0

      - name: Build Android APK
        shell: bash
        run: |
          set +e

          godot --headless \
            --verbose \
            --path . \
            --export-debug "Android" \
            build/TrafficCity3D.apk \
            > diagnostics/export.log 2>&1

          RESULT=$?

          cat diagnostics/export.log

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Godot Android export failed"
            exit 1
          fi

          if [ ! -s build/TrafficCity3D.apk ]; then
            echo "::error::APK was not created"
            exit 1
          fi

          echo "APK created successfully"

      - name: Verify Android APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="build/TrafficCity3D.apk"

          "$ANDROID_HOME/build-tools/34.0.0/aapt" \
            dump badging "$APK"

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify "$APK"

          ls -lh "$APK"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrafficCity3D-Diagnostics
          path: diagnostics/
          if-no-files-found: ignore

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrafficCity3D-Android-APK
          path: build/TrafficCity3D.apk
          if-no-files-found: error

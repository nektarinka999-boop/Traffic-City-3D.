
name: Traffic City 3D - Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

          godot --version

      - name: Install Android export templates
        shell: bash
        run: |
          set -euo pipefail

          DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$DIR"

          wget -q \
            https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* "$DIR/"

          test -s "$DIR/android_debug.apk"

      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Traffic City,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot editor
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Generate signed Android preset
        shell: bash
        run: |
          set -euo pipefail

          cat > export_presets.cfg <<EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/TrafficCity3D.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          gradle_build/use_gradle_build=false
          package/unique_name="com.trafficcity3d.game"
          package/name="Traffic City 3D"
          version/code=1
          version/name="0.1"
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug="$HOME/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF

      - name: Import project
        shell: bash
        run: |
          mkdir -p diagnostics

          set +e

          godot --headless \
            --path . \
            --editor \
            --import \
            --quit \
            > diagnostics/import.log 2>&1

          RESULT=$?
          cat diagnostics/import.log
          exit "$RESULT"

      - name: Diagnose editor settings
        shell: bash
        run: |
          mkdir -p diagnostics

          set +e

          godot --headless \
            --editor \
            --path . \
            --script res://check_export.gd \
            > diagnostics/check-export.log 2>&1

          RESULT=$?
          cat diagnostics/check-export.log
          echo "Diagnostic exit code: $RESULT"

          exit 0

      - name: Validate Android configuration
        shell: bash
        run: |
          mkdir -p diagnostics

          python3 - <<'PY' > diagnostics/configuration.log 2>&1
          import configparser
          import os
          from pathlib import Path

          sdk = Path(os.environ["ANDROID_HOME"])
          java = Path(os.environ["JAVA_HOME"])
          home = Path.home()

          checks = {
              "Godot project": Path("project.godot").is_file(),
              "Main scene": Path("main.tscn").is_file(),
              "City script": Path("city.gd").is_file(),
              "Android platform": (sdk / "platforms/android-34").is_dir(),
              "Android build tools": (sdk / "build-tools/34.0.0").is_dir(),
              "Java SDK": java.is_dir(),
              "Android template": (
                  home / ".local/share/godot/export_templates"
                  / "4.3.stable/android_debug.apk"
              ).is_file(),
              "Signing key": (
                  home / ".android/debug.keystore"
              ).is_file(),
          }

          config = configparser.ConfigParser(interpolation=None)
          config.optionxform = str
          config.read("export_presets.cfg")

          checks["Android preset"] = (
              config.get(
                  "preset.0", "platform", fallback=""
              ).strip('"') == "Android"
          )

          options = config["preset.0.options"]
          key_path = options.get("keystore/debug", "").strip('"')

          checks["Preset signing key"] = (
              bool(key_path) and Path(key_path).is_file()
          )

          for name, ok in checks.items():
              print(f"{name}: {'PASS' if ok else 'FAIL'}")

          if not all(checks.values()):
              raise SystemExit(1)
          PY

          cat diagnostics/configuration.log

      - name: Export APK
        shell: bash
        run: |
          mkdir -p build diagnostics

          set +e

          godot --headless \
            --verbose \
            --path . \
            --export-debug "Android" \
            build/TrafficCity3D.apk \
            > diagnostics/export.log 2>&1

          RESULT=$?

          cat diagnostics/export.log

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Godot Android export failed"
            exit 1
          fi

          test -s build/TrafficCity3D.apk

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="build/TrafficCity3D.apk"

          "$ANDROID_HOME/build-tools/34.0.0/aapt" \
            dump badging "$APK" | head -20

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify "$APK"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrafficCity3D-Diagnostics
          path: diagnostics/
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrafficCity3D-Android-APK
          path: build/TrafficCity3D.apk
          if-no-files-found: error


name: Build Traffic City 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

      - name: Install Godot
        shell: bash
        run: |
          set -e
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install export templates
        shell: bash
        run: |
          set -e
          DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$DIR"

          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* "$DIR/"

          test -s "$DIR/android_debug.apk"

      - name: Generate debug keystore
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Traffic City,C=US"

      - name: Configure Godot
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Create Android preset
        shell: bash
        run: |
          cat > export_presets.cfg <<EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/TrafficCity3D.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          gradle_build/use_gradle_build=false
          package/unique_name="com.trafficcity3d.game"
          package/name="Traffic City 3D"
          package/signed=true
          version/code=1
          version/name="0.1"
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug="$HOME/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF

      - name: Import project
        run: |
          godot --headless --path . --editor --import --quit

      - name: Diagnose Godot settings
        shell: bash
        run: |
          mkdir -p diagnostics

          cat > diagnostics_check.gd <<'EOF'
          extends SceneTree

          func _initialize():
              var settings = EditorInterface.get_editor_settings()
              var names = [
                  "export/android/android_sdk_path",
                  "export/android/java_sdk_path",
                  "export/android/debug_keystore"
              ]

              for name in names:
                  print("SETTING: ", name)
                  print("EXISTS: ", settings.has_setting(name))
                  if settings.has_setting(name):
                      print("VALUE: ", settings.get_setting(name))

              quit()
          EOF

          godot --headless --editor --path . \
            --script diagnostics_check.gd \
            > diagnostics/settings.log 2>&1 || true

          cat diagnostics/settings.log

          echo "=== SDK CONTENTS ===" \
            > diagnostics/environment.txt

          ls -la "$ANDROID_HOME" \
            >> diagnostics/environment.txt

          echo "=== JAVA ===" \
            >> diagnostics/environment.txt

          java -version \
            2>> diagnostics/environment.txt

          echo "=== GODOT ===" \
            >> diagnostics/environment.txt

          godot --version \
            >> diagnostics/environment.txt

      - name: Build APK
        shell: bash
        run: |
          mkdir -p build diagnostics

          set +e

          godot --headless --verbose \
            --path . \
            --export-debug "Android" \
            build/TrafficCity3D.apk \
            > diagnostics/export.log 2>&1

          RESULT=$?

          cat diagnostics/export.log

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Android export failed"
            exit 1
          fi

          test -s build/TrafficCity3D.apk

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrafficCity3D-Diagnostics
          path: diagnostics/
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrafficCity3D-Android
          path: build/TrafficCity3D.apk
          if-no-files-found: error

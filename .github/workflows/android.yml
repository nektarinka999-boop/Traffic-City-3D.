
name: Traffic City 3D - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare diagnostics
        shell: bash
        run: |
          mkdir -p diagnostics build
          godot --version | tee diagnostics/godot-version.txt

      - name: Locate Android tools
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=== ENVIRONMENT ==="
            env | grep -E 'ANDROID|JAVA|GODOT|HOME' | sort || true

            echo "=== JAVA ==="
            command -v java || true
            java -version 2>&1 || true

            echo "=== SDK LOCATIONS ==="
            ls -ld /opt/android-sdk /opt/android-sdk-linux \
              /usr/local/lib/android/sdk 2>/dev/null || true

            echo "=== EXPORT TEMPLATES ==="
            find /root /opt "$HOME" \
              -name android_debug.apk \
              -type f 2>/dev/null || true

          } | tee diagnostics/tools.log

      - name: Configure Android environment
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            for candidate in \
              /opt/android-sdk \
              /opt/android-sdk-linux \
              /usr/local/lib/android/sdk; do
              if [ -d "$candidate/platforms" ]; then
                SDK="$candidate"
                break
              fi
            done
          fi

          if [ -z "$SDK" ] || [ ! -d "$SDK/platforms" ]; then
            echo "Android SDK not found" | tee diagnostics/sdk-error.txt
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          if [ -z "${JAVA_HOME:-}" ]; then
            JAVA_BIN="$(readlink -f "$(command -v java)")"
            JAVA_DIR="$(dirname "$(dirname "$JAVA_BIN")")"
            echo "JAVA_HOME=$JAVA_DIR" >> "$GITHUB_ENV"
          fi

          echo "SDK: $SDK"
          ls "$SDK/platforms"
          ls "$SDK/build-tools"

      - name: Prepare Godot export templates
        shell: bash
        run: |
          set -euo pipefail

          TARGET="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TARGET"

          if [ ! -s "$TARGET/android_debug.apk" ]; then
            FOUND="$(find /root /opt \
              -path '*/4.3.stable/android_debug.apk' \
              -type f -print -quit 2>/dev/null || true)"

            if [ -n "$FOUND" ]; then
              cp -a "$(dirname "$FOUND")/." "$TARGET/"
            fi
          fi

          if [ ! -s "$TARGET/android_debug.apk" ]; then
            wget -q \
              https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
              -O /tmp/templates.tpz

            unzip -q /tmp/templates.tpz -d /tmp/godot-templates
            cp -a /tmp/godot-templates/templates/. "$TARGET/"
          fi

          test -s "$TARGET/android_debug.apk"
          ls -lh "$TARGET/android_debug.apk"

      - name: Create debug signing key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Traffic City,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot editor
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Create Android export preset
        shell: bash
        run: |
          set -euo pipefail

          cat > export_presets.cfg <<EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/TrafficCity3D.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          gradle_build/use_gradle_build=false
          package/unique_name="com.trafficcity3d.game"
          package/name="Traffic City 3D"
          version/code=1
          version/name="0.1"
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug="$HOME/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF

      - name: Import Godot project
        shell: bash
        run: |
          set +e

          godot --headless \
            --path . \
            --editor \
            --import \
            --quit \
            > diagnostics/import.log 2>&1

          RESULT=$?
          cat diagnostics/import.log
          exit "$RESULT"

      - name: Check Android settings
        shell: bash
        run: |
          set +e

          godot --headless \
            --editor \
            --path . \
            --script res://check_export.gd \
            > diagnostics/check-export.log 2>&1

          RESULT=$?
          cat diagnostics/check-export.log
          echo "Diagnostic exit code: $RESULT"

          exit 0

      - name: Export Android APK
        shell: bash
        run: |
          set +e

          godot --headless \
            --verbose \
            --path . \
            --export-debug "Android" \
            build/TrafficCity3D.apk \
            > diagnostics/export.log 2>&1

          RESULT=$?
          cat diagnostics/export.log

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Android export failed"
            exit 1
          fi

          if [ ! -s build/TrafficCity3D.apk ]; then
            echo "::error::APK file was not created"
            exit 1
          fi

          echo "APK created successfully"
          ls -lh build/TrafficCity3D.apk

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="build/TrafficCity3D.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" \
            -name aapt -type f | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -1)"

          "$AAPT" dump badging "$APK" | head -20
          "$APKSIGNER" verify "$APK"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrafficCity3D-Diagnostics
          path: diagnostics/
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrafficCity3D-Android-APK
          path: build/TrafficCity3D.apk
          if-no-files-found: error
